<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Aurora Studio">
  <defs>
    <linearGradient id="aurora-studio-sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c6cf6"/>
      <stop offset="0.52" stop-color="#3fa9f5"/>
      <stop offset="1" stop-color="#2fe3b4"/>
    </linearGradient>
    <linearGradient id="aurora-studio-band" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="aurora-studio-face" x1="0.28" y1="0" x2="0.72" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ebe5ff"/>
    </linearGradient>
    <radialGradient id="aurora-studio-shine" cx="0.28" cy="0.18" r="0.9">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.34"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- aurora gradient rounded square -->
  <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#aurora-studio-sky)"/>
  <path d="M4 84 C 30 62 52 104 82 80 C 102 64 114 70 124 60 L124 94 C 106 106 92 92 74 100 C 50 110 26 96 4 108 Z" fill="url(#aurora-studio-band)"/>
  <path d="M4 108 C 28 94 48 112 74 102 C 98 93 112 102 124 92 L124 124 L4 124 Z" fill="#ffffff" opacity="0.08"/>
  <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#aurora-studio-shine)"/>

